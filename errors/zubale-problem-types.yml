generated: '2026-07-21'
method: searched
source: https://developers.zubale.com/ (Zubale API overview, HTTP status code tables)
format: http-status
envelope: >-
  The Zubale API signals outcomes with standard HTTP status codes. Successful
  requests return 200; errors return 4xx/5xx with a message body. The API does not
  publish an RFC 9457 problem+json envelope.
problems:
- status: 200
  title: Request successful
  meaning: The request completed successfully (also returned on user/resource creation).
- status: 400
  title: Bad request
  meaning: The request was malformed or missing required fields.
- status: 401
  title: Unauthorized / Invalid token
  meaning: Missing, expired, or invalid OAuth2 bearer token.
  remediation: Re-mint an access token via POST /oauth2/token and retry with a fresh Bearer token.
- status: 404
  title: Content not found
  meaning: The requested resource or content does not exist.
- status: 409
  title: Format not recognized
  meaning: The request format or encoding format was not recognized by the API.
- status: 500
  title: Internal server error
  meaning: An unexpected error occurred on the Zubale side.
