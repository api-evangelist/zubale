        "Issues with the order" Must to send “CANCEL” Issuer The entity that sends tihs request String
        "Client", "Customer" Maximum 256 characteres
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            example:
              orderId: '{{customer_order_id}}'
              details: Cancellation reason
              issuer: CLIENT
      responses:
        '200':
          description: Successful response
