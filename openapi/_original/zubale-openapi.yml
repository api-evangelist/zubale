  /integration/notify-status:
    post:
      operationId: notifyStatusChangeCustomerSide
      summary: Notify Status Change (Customer side)
      tags:
      - Delivery API
      description: 'Notify Status Change (Customer side) We can inform you about changes in the order
        status. You need to provide an endpoint to which we can send the below notifications. The optional
        status will depend on the sales process that you cary out. The following is a list of the statuses
        that we can notify: Delivery Statuses Status Description Default / Optional TASK_SCHEDULED Indicates
        the first state when the task was scheduled Indicates when a return occurs and the task is re-queued
        and it is ready to be taken or cancelled. DEFAULT TASK_ASSIGNED Indicates the moment when the
        zubalero takes the order. DEFAULT PICKED_OUT Indicates the moment when the zubalero starts the
        delivery process and He already has the order DEFAULT ENROUTE_TO_DROPOFF Indicates the moment
        when the zubalero navigates the map for the customer''s location DEFAULT AT_DROPOFF Indicates
        the moment when the zubalero arrives at the address and proceeds to call then fill in the data
        and the client''s signature. DEFAULT DELIVERED Indicates when the delivery is complete. DEFAULT
        PENDING_RETURN Indicates the moment when the zubalero finish delivery and must come back to the
        store OPTIONAL ENROUTE_TO_RETURN Indicates the moment wh'
      security: []
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Successful response
