  /integration/notify_status:
    post:
      operationId: notifyStatusChange
      summary: Notify Status Change
      tags:
      - Picking & Delivery API
      description: 'Notify Status Change (Customer side) We can inform you about changes in the order
        status. Through a JSON format You need to provide an endpoint to which we can send notifications
        detailed on following table. The optional status will depend on the operational process that you
        carry out. PICKING STATUSES The following is a list of the statuses that we could notify: Status
        Description Default / Optional TASK_SCHEDULED Indicates the first state when the task was scheduled
        Indicates when a return occurs and the task is re-queued and it is ready to be taken or cancelled.
        DEFAULT TASK_ASSIGNED Indicates the moment when the Zubalero takes the order. DEFAULT PICKING_STARTED
        This state occurs when the zubalero takes the task and reads the instructions to start collecting
        the products. DEFAULT PRODUCT_ADDED Indicates the moment when Zubalero added to cart the first
        product. (and only for the first product) DEFAULT PRODUCT_SCANNED Indicates the moment when Zubalero
        scanned the first product OPTIONAL CALLED_CUSTOMER Indicates the moment when zubalero calls the
        client to make a replace, add or remove a product. Also this status is sent when zubalero arrives
        at the client´s address. OPTIONAL AT_C'
      security: []
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Successful response
