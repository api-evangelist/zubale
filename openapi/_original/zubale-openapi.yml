  /product-catalog/api/v1/catalog/{brand_id}:
    post:
      operationId: createCatalog
      summary: Create catalog
      tags:
      - Product catalog
      description: 'JSON object mass creation Based on a JSON array of products, create products massively
        in our service. brand_id in the path params is an integer value provided by Zubale. Note: each
        brand can only have 1 existing catalog, which means calling this endpoint again will overwrite
        your existing data, this includes all product records from all stores . Warning: if you''re integrating
        your stock service with us, make sure to set all products stock values to 0 . Key Value store_id
        Your store identifier. product_code Your product''s code (formatted as SKU, EAN, GTIN, ISBN, etc.).
        name Product name. brand Product brand''s name. description Product description. available Product
        availabilty. condition Condition of the product (new, refurbished, used). price Product base price
        for the previously defined store. sale_price Product price if it''s in sale, else use base price.
        link URL to your product''s page. image_link URL to your product''s image. department Product
        categorization. restricted Certain products might be restricted (like alcohol and medicines),
        for any other product that might not fall into this category, set this field to false.'
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Successful response
    put:
      operationId: updateCatalog
      summary: Update catalog
      tags:
      - Product catalog
      description: Update a given list of products. This endpoint will not overwrite your existing data.
        Attempting to update an unexisting record won't create it, meaning that if you send a product
        that isn't on our database will not attempt to insert it. To make sure it exists, please refer
        to the Get products(s) section brand_id in the path params is an integer value provided value.
        "brand_id", "store_id" and "product_code" are mandatory fields. Any undeclared, empty strings,
        zero and null values won't be overwritten on the original record.
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Successful response
