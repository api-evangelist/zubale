tags:
- name: Cancel tasks
paths:
  /orders/api/{brandId}/cancel:
    put:
      operationId: cancelTask
      summary: Cancel task
      tags:
      - Cancel tasks
      description: This endpoit is used to cancel an order that was previously created. When cancelling an order the process of delivery or picking and deliver will finish This API is use to both service, delivery or picking and delivery Request Atributte Description Datatype Example Note orderId Order identifier String “order_1234_4566” In picking and delivery externalOrderId = customkey In delivery externalOrderId = externalOrderId details Your cancellation reason String “Cancelled by client”, "Issues with the order" Must to send “CANCEL” Issuer The entity that sends tihs request String "Client", "Customer" Maximum 256 characteres
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            example:
              orderId: '{{customer_order_id}}'
              details: Cancellation reason
              issuer: CLIENT
      responses:
        '200':
          description: Successful response
  /orders/api/{brand_id}/cancel:
    put:
      operationId: cancelTask2
      summary: Cancel task
      tags:
